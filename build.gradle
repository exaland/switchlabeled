plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'io.github.exaland.switchlabeled'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Publier AAR + Sources + Javadoc
    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'

}

publishing {
    publications {
        create("release", MavenPublication) {
            groupId = "io.github.exaland"
            artifactId = "switchlabeled"
            version = "1.0.0"
            // Ajoute aussi les sources et Javadoc si besoin
            // (déjà dans ta configuration précédente)
            pom {
                // ... (tes métadonnées)
            }
            // Ajoute l'artefact AAR
            artifact("$buildDir/outputs/aar/${project.name}-release.aar")
        }
    }
    repositories {
        // Publication vers GitHub Packages
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/exaland/switchlabeled")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("TOKEN_GITHUB")
            }
        }
        // Publication vers OSSRH
        maven {
            name = "OSSRH"
            url = uri("https://oss.sonatype.org/service/local/staging/deploy/maven2/")
            credentials {
                username = project.findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
                password = project.findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
            }
        }
    }
}


// GPG signing configuration (in-memory recommended for CI/CD)
signing {
    useGpgCmd()
    sign(publishing.publications["release"])
}
