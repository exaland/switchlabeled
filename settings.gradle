pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }


dependencies {
    // Ensure all dependencies specify compatible versions
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'com.google.android.material:material:1.13.0'
    // Add other missing or required libraries here
}
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.android.application" || requested.id.id == "com.android.library") {
                // Change the AGP version below to one compatible with your Gradle wrapper
                useModule("com.android.tools.build:gradle:8.5.0")
            }
        }
    }
}
rootProject.name = "switchlabeled"
